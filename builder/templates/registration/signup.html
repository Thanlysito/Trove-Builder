{% extends "builder/base.html" %}
{% load i18n %}
{% block title %}{% translate "Crear cuenta" %} — Trove Builder{% endblock %}
{% block content %}
<h1>{% translate "Crear cuenta" %}</h1>
<form method="post" style="max-width:360px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">{% translate "Crear cuenta" %}</button>
</form>
<p style="margin-top:14px;"><small>{% translate "¿Ya tienes cuenta?" %} <a href="{% url 'login' %}">{% translate "Inicia sesión" %}</a></small></p>
{% endblock %}
